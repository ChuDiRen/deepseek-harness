# dsh-files bundle patch: one insert registering the read_document tool plugin
# and the attachment loop (0.6.1).
# `id` is the bundle identity (host-side patch toggles match on it, independent
# of the package name); `name` must match the node half's exported cordis `name`.
- insert:
    - id: files-toolkit
      name: 'dsh-files'
      config:
        maxFileBytes: 25165824
        readLimit: 2000
        sheetRowLimit: 200
        maxSheets: 5
        maxOutputChars: 24000
        readTimeoutMs: 120000
        # 附件闭环（0.6.1）：面板/下载/导出/@ 源总开关。
        attachmentsEnabled: true
        # 单次附件下载/导出字节上限（超限 413）。
        maxDownloadBytes: 209715200
        # 非回环访问的授权 host[:port]（LAN/域名部署必配，本地回环无需配置）。
        # trustedHosts: [ 'dsh.example.com', '192.168.1.20:3080' ]
