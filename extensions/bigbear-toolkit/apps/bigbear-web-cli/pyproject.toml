[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbear-web-cli"
version = "1.0.6"
description = "AI-powered browser control via Playwright CDP"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "loguru>=0.7.0",
    "playwright>=1.40.0",
    "openai>=1.3.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.28.0",
    "pyarmor>=8.0.0",
]

[project.scripts]
bigbear-web-cli = "bigbear_web.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
