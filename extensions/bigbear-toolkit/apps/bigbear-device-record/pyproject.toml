[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bigbear-device-record"
version = "1.0.0"
description = "华测多设备画面采集工具 - Android/iOS/Harmony/PC 设备画面录制，输出与 bigbear-web-record 兼容的 JSON"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "pydantic>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "playwright==1.57.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
bigbear-device-record = "bigbear_device_record.cli:main"

[project.optional-dependencies]
vision = ["openai>=1.0.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "httpx>=0.24,<0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
